{% extends 'base.html' %}

{% block title %}Queue · SWIFT Monitor{% endblock %}

{% block content %}
<section class="panel">
    <div class="toolbar-row">
        <div class="filters">
            <select id="queue-status-filter">
                <option value="">All statuses</option>
                <option value="PRIORITY">Priority</option>
                <option value="ACTION_REQUIRED">Action required</option>
                <option value="IN_PROGRESS">In progress</option>
                <option value="RESOLVED">Resolved</option>
                <option value="RESPONDED">Responded</option>
            </select>
            <select id="queue-category-filter">
                <option value="">All categories</option>
                <option value="AMENDMENT">Amendment</option>
                <option value="CANCELLATION">Cancellation</option>
                <option value="CALLBACK">Callback</option>
                <option value="ABA_REQUEST">ABA request</option>
                <option value="OTHER">Other</option>
            </select>
            <input id="queue-search" type="search" placeholder="Search reference, BIC or purpose" />
        </div>
    </div>
</section>

<section class="panel">
    <div class="table-wrap">
        <table class="data-table">
            <thead>
                <tr>
                    <th>Priority</th>
                    <th>Ref</th>
                    <th>Type</th>
                    <th>Category</th>
                    <th>Sender BIC</th>
                    <th>Amount</th>
                    <th>Purpose</th>
                    <th>Age</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="queue-table-body"></tbody>
        </table>
    </div>
</section>

<script>
    document.body.dataset.page = 'queue';
</script>
{% endblock %}
