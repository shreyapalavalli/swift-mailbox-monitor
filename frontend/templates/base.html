<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}SWIFT Monitor{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}" />
</head>
<body data-page="{{ 'overview' if request.path == '/' else request.path.strip('/').split('/')[0] }}">
<div class="shell">
    <nav class="rail" aria-label="Views">
        <a href="/" class="{% if request.path == '/' %}on{% endif %}" title="Overview" aria-label="Overview">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        </a>
        <a href="/queue" class="{% if request.path == '/queue' %}on{% endif %}" title="Work queue" aria-label="Work queue">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
        </a>
        <a href="/activity" class="{% if request.path == '/activity' %}on{% endif %}" title="Activity" aria-label="Activity">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>
        </a>
        <a href="/system" class="{% if request.path == '/system' %}on{% endif %}" title="System" aria-label="System">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>
        </a>
    </nav>

    <main>
        <header class="top">
            <div class="logo" aria-label="Société Générale">
                <img src="{{ url_for('static', filename='img/sg-logo.png') }}" alt="Société Générale" class="sg-logo" />
            </div>
            <div class="tools">
                <span class="pill" id="connection-pill"><i class="dot"></i><span>Connecting</span></span>
                <span class="pill" id="last-activity">Last activity: never</span>
                <div class="date-tools" title="Filter monitor data by date">
                    <input type="date" id="datePick" aria-label="Select date" />
                    <button class="date-select" id="dateSelect" type="button">
                        <span>Date</span>
                        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>
                    </button>
                </div>
                <button class="btn" id="check-now-btn" type="button">Check mailbox now</button>
                <select class="sel" id="nav" aria-label="Switch view">
                    <option value="overview" {% if request.path == '/' %}selected{% endif %}>Monitor reports</option>
                    <option value="queue" {% if request.path == '/queue' %}selected{% endif %}>Work queue</option>
                    <option value="activity" {% if request.path == '/activity' %}selected{% endif %}>Activity log</option>
                    <option value="system" {% if request.path == '/system' %}selected{% endif %}>System</option>
                </select>
            </div>
        </header>

        <h1 id="title">SWIFT Monitor</h1>
        <p class="sub" id="sub">Incoming SWIFT messages, classified and actioned automatically.</p>
        <div class="header-divider" aria-hidden="true"></div>

        <div id="dry-run-banner" class="banner hidden">Dry run: classification only, no mailbox changes are being made.</div>

        {% block content %}{% endblock %}
    </main>
</div>

<div id="toast-container" class="toast-container" aria-live="polite"></div>

<script>window.SWIFT_API_BASE = {{ api_base | tojson }};</script>
<script src="{{ url_for('static', filename='js/api.js') }}"></script>
<script src="{{ url_for('static', filename='js/store.js') }}"></script>
<script src="{{ url_for('static', filename='js/alerts.js') }}"></script>
<script src="{{ url_for('static', filename='js/poller.js') }}"></script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    const dateButton = document.getElementById('dateSelect');
    const datePicker = document.getElementById('datePick');
    if (dateButton && datePicker) {
        dateButton.addEventListener('click', () => {
            if (typeof datePicker.showPicker === 'function') datePicker.showPicker();
            else datePicker.click();
        });
        datePicker.addEventListener('change', () => {
            window.swiftMonitorStore.selectedDate = datePicker.value || null;
            if (window.swiftMonitorApp && typeof window.swiftMonitorApp.refreshAll === 'function') {
                window.swiftMonitorApp.refreshAll();
            }
        });
    }
    const nav = document.getElementById('nav');
    if (nav) nav.addEventListener('change', () => {
        const routes = {overview:'/', queue:'/queue', activity:'/activity', system:'/system'};
        window.location.href = routes[nav.value] || '/';
    });
});
</script>
</body>
</html>
