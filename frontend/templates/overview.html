{% extends 'base.html' %}

{% block title %}Overview · SWIFT Monitor{% endblock %}

{% block content %}
<section id="priority-alert-strip" class="alerts" aria-live="polite"></section>

<section id="metrics-grid" class="metrics-grid"></section>

<section class="dashboard-grid">
    <div class="panel">
        <div class="panel-header">
            <h2>Work queue <small><a href="/queue">View all</a></small></h2>
        </div>
        <div class="table-wrap">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Priority</th>
                        <th>Ref</th>
                        <th>Type</th>
                        <th>Category</th>
                        <th>Amount</th>
                        <th>Age</th>
                        <th>Status</th>
                        <th class="right">Actions</th>
                    </tr>
                </thead>
                <tbody id="overview-queue-body"></tbody>
            </table>
        </div>
    </div>

    <div class="panel">
        <div class="panel-header">
            <h2>Live activity</h2>
        </div>
        <ul id="activity-feed" class="activity-feed"></ul>
    </div>
</section>

<script>
    document.body.dataset.page = 'overview';
</script>
{% endblock %}
